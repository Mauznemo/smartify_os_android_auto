name: smartify_os_android_auto
description: "Android Auto for SmartifyOS: plug a phone in, or connect it over Bluetooth, and it projects."
version: 0.1.0
repository: https://github.com/Mauznemo/smartify_os_android_auto
# android_auto links aasdk, which is GPL, so everything shipping it is too.
license: GPL-3.0-or-later
publish_to: none

environment:
  # The same as smartify_os_core. android_auto asks for a newer Dart than
  # this, which pub enforces on its own; this only picks the language version
  # the code here is written in, and freezed's output does not compile under
  # 3.13's.
  sdk: ^3.10.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # The oldest SmartifyOS this works with. The car's app picks which one it
  # actually runs, see EXTENSIONS.md in the SmartifyOS repository.
  smartify_os_core: ">=0.0.1"

  android_auto: ^0.1.7

  # Packages SmartifyOS uses itself: the car's SmartifyOS picks the version.
  flutter_riverpod: any
  freezed_annotation: any
  shared_preferences: any
  slang: any
  slang_flutter: any
  flutter_svg: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # A phone that does exactly what a test tells it to, at the time it says.
  android_auto_platform_interface: any
  fake_async: ^1.3.3
  build_runner: ^2.11.1
  freezed: ^3.2.3

# What the car needs installed on Linux, read by the smartify-os CLI (the format
# is in EXTENSIONS.md in the SmartifyOS repository). Libraries the plugin links
# against are not under `run`: the CLI reads those off the finished build.
smartify_os:
  linux:
    build:
      apt:
        # What the android_auto plugin builds aasdk and its decoder against,
        # from its README.
        - libboost-all-dev
        - libusb-1.0-0-dev
        - libssl-dev
        - libprotobuf-dev
        - protobuf-compiler
        - libavcodec-dev
        - libavutil-dev
        - libswscale-dev
        - libva-dev
        - libpulse-dev
        - libegl1-mesa-dev
        - libgles2-mesa-dev
    run:
      apt:
        # Hardware video decoding. Loaded while it runs, so the build cannot see
        # it; without a driver the picture is decoded in software instead.
        - libva-drm2
        - mesa-va-drivers
        - package: intel-media-va-driver
          arch: [x64]
        # Wireless Android Auto: the phone finds the car over Bluetooth, then
        # joins a hotspot brought up with nmcli after asking iw what the Wi-Fi
        # can do.
        - bluez
        - network-manager
        - iw
      # Lets SmartifyOS open a phone plugged in over USB without being root.
      udev:
        - system/udev/70-android-auto.rules
      groups:
        - plugdev
